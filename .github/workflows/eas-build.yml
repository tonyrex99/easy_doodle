name: Build Android (via EAS) & Submit to Play

# EAS path — runs on push to `master` / `main` or manual trigger.
# Builds using the `production` EAS profile on GitHub runner and optionally submits to Google Play.
# Requires EXPO_TOKEN in GitHub repository secrets.

on:
  workflow_dispatch:

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .aab via EAS on GitHub runner
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build .aab locally via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          eas build --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output artifacts/app.aab

      - name: Upload .aab as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: artifacts/app.aab
          if-no-files-found: error
          retention-days: 14

  submit:
    name: Upload to Google Play (internal track)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .aab
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: artifacts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Submit to Play Console
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts/
          eas submit --platform android --path artifacts/app.aab --non-interactive --profile production

