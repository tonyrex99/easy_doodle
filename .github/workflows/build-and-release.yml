name: Build Android (APK & AAB) & Create GitHub Release

# Builds Android APK (installable on phone) and AAB (Google Play bundle)
# directly on the GitHub Actions Ubuntu runner, and creates a GitHub Release.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: github-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android on GitHub Runner
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android native project
        run: npx expo prebuild --platform android --clean

      - name: Configure Release Keystore
        working-directory: android
        run: |
          # Generate signing keystore for self-signed release if none exists
          KEYSTORE_PATH="app/release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias easydoodle \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass easydoodlepassword \
              -keypass easydoodlepassword \
              -dname "CN=EasyDoodle, OU=App, O=TonyRex, L=City, S=State, C=US"
          fi

      - name: Build Android APK (Installable) & AAB (Play Store)
        working-directory: android
        run: |
          chmod +x gradlew
          # Build APK
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          # Build App Bundle for Google Play
          ./gradlew bundleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          
          # Find and copy APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" artifacts/easy-doodle-release.apk
            echo "Found APK: $APK_FILE -> artifacts/easy-doodle-release.apk"
          fi

          # Find and copy AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" artifacts/easy-doodle-release.aab
            echo "Found AAB: $AAB_FILE -> artifacts/easy-doodle-release.aab"
          fi

          ls -lh artifacts/

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: easy-doodle-android-builds
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Read App Version
        id: get_version
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const ver = app.expo.version || '1.0.0';
            const tag = 'v' + ver + '-build.' + process.env.GITHUB_RUN_NUMBER;
            console.log('Version:', ver);
            console.log('Tag:', tag);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + ver + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "Easy Doodle ${{ steps.get_version.outputs.version }} (Build #${{ github.run_number }})"
          body: |
            ## Easy Doodle v${{ steps.get_version.outputs.version }} 🎨
            
            Automated production build generated by GitHub Actions CI/CD on `${{ github.ref_name }}`.

            ### 📦 Download Assets
            - 📲 **Installable Android APK:** [`easy-doodle-release.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/easy-doodle-release.apk) *(install directly on your phone)*
            - 🚀 **Google Play Store Bundle:** [`easy-doodle-release.aab`](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/easy-doodle-release.aab) *(upload to Google Play Console)*

            ### Build Info
            - **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            artifacts/easy-doodle-release.apk
            artifacts/easy-doodle-release.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false

